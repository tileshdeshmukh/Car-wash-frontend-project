<div class="container min-vh-100 d-flex align-items-center justify-content-center bg-white">
  <div class="text-center py-5">
    
    <!-- Animated Large 404 Numbers -->
    <div class="error-code-wrapper position-relative mb-4 select-none">
      <h1 class="display-1 fw-black text-dark m-0 floating-animation">
        4<span class="text-warning glowing-eye">0</span>4
      </h1>
    </div>

    <!-- Error Message Details -->
    <h2 class="h1 fw-extrabold text-dark mb-3">Oops! Page Not Found</h2>
    <p class="text-muted fs-5 max-w-500 mx-auto mb-5">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>

    <!-- Action Back Link Directives -->
    <div>
      <button routerLink="/home" class="btn btn-dark btn-lg rounded-pill px-5 py-3 fw-bold text-white shadow hover-scale-warning">
        Back to Home
      </button>
    </div>

  </div>
</div>
