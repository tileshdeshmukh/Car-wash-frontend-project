<section class="hero-section bg-dark text-white position-relative overflow-hidden py-5 d-flex align-items-center min-vh-100">
  <!-- Soft ambient background glow overlay -->
  <div class="hero-bg-glow"></div>

  <div class="container position-relative z-2">
    <div class="row align-items-center g-5">
      
      <!-- Left Column: Marketing Content -->
      <div class="col-lg-6 text-center text-lg-start">
        <div class="pe-lg-4">
          
          <!-- Small Tagline Accent -->
          <h6 class="text-warning fw-bold text-uppercase tracking-wider mb-3 small d-flex align-items-center justify-content-center justify-content-lg-start">
            <span class="accent-dash bg-warning me-2"></span> We Wash, You Shine
          </h6>
          
          <!-- Main Hero Title Heading -->
          <h1 class="display-3 fw-black text-white lh-sm mb-4">
            Shining Cars,<br>Happy Drivers
          </h1>
          
          <!-- Secondary Subtitle Summary -->
          <p class="lead text-white-50 fs-5 mb-5 max-w-500">
            Clean, shine, and care – your car deserves the best.
          </p>
          
          <!-- Interactive Action Buttons -->
          <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start">
            <!-- Main Warning Booking Action -->
            <a routerLink="/booknow" class="btn btn-warning btn-lg px-5 py-3 rounded-pill fw-bold text-dark shadow-sm hover-grow">
              Book Now
            </a>
            
            <!-- Video Trigger Button -->
            <button class="btn btn-outline-light btn-lg px-4 py-3 rounded-pill fw-semibold d-flex align-items-center gap-2 hover-dim">
              <span>Video</span>
              <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
              </svg>
            </button>
          </div>

        </div>
      </div>

      <!-- Right Column: Hero Visual Graphic Container -->
      <div class="col-lg-6 text-center floating-animation">
        <!-- Replace source file below with your local hero car image path -->
        <!-- <img src="img/homeimg.jpg"  -->
         <img src="img/homeimg.png" 
             alt="Polished red luxury sports car with water droplets" 
             class="img-fluid hero-car-img drop-shadow-lg animate-fade-in" />
      </div>

    </div>
  </div>
</section>
